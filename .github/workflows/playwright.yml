
name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Generate Linux snapshots
        run: npx playwright test tests/homework.spec.js --project=chromium --update-snapshots

      - name: Upload Linux snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/homework.spec.js-snapshots/*-linux.png

      - name: Upload HTML Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

